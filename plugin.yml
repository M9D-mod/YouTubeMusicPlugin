name: YouTubeMusic
version: 0.1.0
main: dev.example.youtubemusic.YouTubeMusicPlugin
api-version: '26.2'
description: Plays authorized custom sounds through a server resource pack.
authors: [Example]
commands:
  music:
    description: Music and resource-pack commands
    usage: /music <play|stop|pack|youtube>
    aliases: [mus]
permissions:
  youtubemusic.play:
    default: true
  youtubemusic.control:
    default: true
  youtubemusic.admin:
    default: op
